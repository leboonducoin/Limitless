name: Attested preview

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build inert macOS preview
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift Tools/ProjectTool.swift check
      - run: swift Tools/ProjectTool.swift bundle
        env:
          LIMITLESS_OUTPUT_DIR: ${{ runner.temp }}/limitless-preview
          LIMITLESS_PREVIEW_STATE: inactive
      - name: Archive the inert preview
        working-directory: ${{ runner.temp }}
        run: |
          ditto -c -k --keepParent limitless-preview/Limitless.app Limitless-Preview.zip
          shasum -a 256 Limitless-Preview.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Limitless-Preview
          path: |
            ${{ runner.temp }}/Limitless-Preview.zip
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  attest:
    name: Attest preview archive
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # Download and identify the preview workflow artifact.
      artifact-metadata: write # Link the preview artifact to its attestation.
      attestations: write # Store the preview provenance in GitHub.
      contents: read
      id-token: write # Obtain the OIDC token used to sign the provenance.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Limitless-Preview
      - run: sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Limitless-Preview.zip
