name: Attest distribution archive

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag, such as v1.2.0
        required: true
        type: string
      signed_app_sha256:
        description: SHA-256 of the signed input zip, computed on the signing Mac
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch draft release input
    if: github.repository == 'leboonducoin/Limitless' && github.ref == 'refs/heads/main' && github.actor == 'leboonducoin' && github.triggering_actor == 'leboonducoin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Read the asset from a draft release, which requires write access.
    steps:
      - name: Fetch the exact signed and stapled input from the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          INPUT_SHA256: ${{ inputs.signed_app_sha256 }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$INPUT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv')" = "$(printf 'true\t%s' "$GITHUB_SHA")"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Limitless-Signed-App.zip --dir "$RUNNER_TEMP"
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/Limitless-Signed-App.zip" | sha256sum -c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Limitless-signed-input
          path: ${{ runner.temp }}/Limitless-Signed-App.zip
          retention-days: 1
          if-no-files-found: error

  package:
    name: Verify and package signed app
    needs: fetch
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Limitless-signed-input
          path: ${{ runner.temp }}
      - name: Verify the app, package the distribution and check the exported archive
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
          TAG: ${{ inputs.tag }}
          TEAM: 'M6XP489RMK'
          INPUT_SHA256: ${{ inputs.signed_app_sha256 }}
        run: |
          [[ "$INPUT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/Limitless-Signed-App.zip" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/signed-input"
          ditto -x -k "$RUNNER_TEMP/Limitless-Signed-App.zip" "$RUNNER_TEMP/signed-input"
          swift Tools/ProjectTool.swift package "$RUNNER_TEMP/signed-input/Limitless.app" "$TEAM" "$RUNNER_TEMP/distribution"
          test -f "$RUNNER_TEMP/distribution/Limitless-${TAG#v}-macos-universal.zip"
          test -f "$RUNNER_TEMP/distribution/release-v2.json"
          test ! -e "$RUNNER_TEMP/distribution/release.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Limitless-distribution
          path: ${{ runner.temp }}/distribution/
          retention-days: 7
          if-no-files-found: error

  attest:
    name: Attest distribution archive
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # Download and identify the packaged workflow artifact.
      artifact-metadata: write # Link the packaged artifact to its attestation.
      attestations: write # Store the archive provenance in GitHub.
      contents: read
      id-token: write # Obtain the OIDC token used to sign the provenance.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Limitless-distribution
      - run: sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Limitless-*-macos-universal.zip
