name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift / ${{ matrix.check }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: check
            xcode: '26.2'
          - check: asan
            xcode: '26.6'
          - check: tsan
            xcode: '26.6'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Swift code without changing host power settings
        env:
          CHECK: ${{ matrix.check }}
        run: swift Tools/ProjectTool.swift "$CHECK"
      - name: Build and inspect the development app bundle
        if: matrix.check == 'check'
        env:
          LIMITLESS_CONFIGURATION: release
          LIMITLESS_OUTPUT_DIR: ${{ runner.temp }}/limitless-bundle
        run: swift Tools/ProjectTool.swift bundle
      - name: Build and inspect the community helper metadata without installation
        if: matrix.check == 'check'
        env:
          LIMITLESS_CONFIGURATION: release
          LIMITLESS_OUTPUT_DIR: ${{ runner.temp }}/limitless-community-bundle
        run: swift Tools/ProjectTool.swift community-bundle
