name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift / ${{ matrix.check }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: check
            xcode: '26.2'
          - check: asan
            xcode: '26.6'
          - check: tsan
            xcode: '26.6'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Swift code without changing host power settings
        env:
          CHECK: ${{ matrix.check }}
        run: swift Tools/ProjectTool.swift "$CHECK"
      - name: Build and inspect the development app bundle
        if: matrix.check == 'check'
        env:
          LIMITLESS_CONFIGURATION: release
          LIMITLESS_OUTPUT_DIR: ${{ runner.temp }}/limitless-bundle
        run: swift Tools/ProjectTool.swift bundle
      - name: Build and inspect the community helper metadata without installation
        if: matrix.check == 'check'
        env:
          LIMITLESS_CONFIGURATION: release
          LIMITLESS_OUTPUT_DIR: ${{ runner.temp }}/limitless-community-bundle
        run: swift Tools/ProjectTool.swift community-bundle
      - name: Archive the universal CLI for compatibility tests
        if: matrix.check == 'check'
        run: ditto -c -k --keepParent "$RUNNER_TEMP/limitless-community-bundle/Limitless.app/Contents/MacOS/limitless" "$RUNNER_TEMP/limitless-cli.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.check == 'check'
        with:
          name: compatibility-cli
          path: ${{ runner.temp }}/limitless-cli.zip
          retention-days: 1
          if-no-files-found: error

  compatibility:
    name: Compatibility / ${{ matrix.os }}
    needs: swift
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compatibility-cli
          path: ${{ runner.temp }}/compatibility
      - name: Run the shipped CLI on older macOS
        working-directory: ${{ runner.temp }}/compatibility
        run: |
          ditto -x -k limitless-cli.zip .
          ./MacOS/limitless --version
          ./MacOS/limitless --help
      - name: Run the full checks on Intel
        if: matrix.os == 'macos-15-intel'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: swift Tools/ProjectTool.swift check

  gate:
    name: CI gate
    if: always()
    needs: [swift, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all builds, tests and compatibility checks
        env:
          PASSED: ${{ needs.swift.result == 'success' && needs.compatibility.result == 'success' }}
        run: test "$PASSED" = true
